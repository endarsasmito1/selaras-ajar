name: Test & Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Feedback teknis (Sep 2026) — sebelumnya push/merge beruntun numpuk beberapa run bersamaan
# (gak ada concurrency control), bikin akun kena limit run paralel & 4 run sekaligus ke-cancel
# GitHub sendiri di waktu yang sama persis, gak ada satu pun yang sempat lolos verifikasi. Run
# baru utk ref yang sama sekarang otomatis membatalkan run lama yang belum selesai.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Feedback teknis (Sep 2026) — sebelumnya job "deploy" langsung jalan begitu ada push ke main,
  # gak ada apa pun yang gate-in kalau kode ternyata rusak secara fungsional (build sukses tapi
  # logic/regresi/keamanan salah) — `deploy.sh` sendiri cuma jaga dari build GAGAL (set -e), bukan
  # dari build SUKSES tapi salah. Suite Playwright (tests/e2e/, 253 test) udah ada dari sebelumnya
  # tapi gak pernah dijalankan di sini — job ini yang gate-in-nya sekarang, baik di PR (sebelum
  # merge, begitu branch protection main diaktifkan) maupun di push langsung ke main (sebelum deploy).
  test:
    runs-on: ubuntu-latest
    # Feedback teknis (Sep 2026) — sebelumnya gak ada batas sama sekali, sekali ketemu run yang
    # genuinely hang (bukan lambat — dicek langsung 47+ menit macet persis di satu step yg lokal
    # cuma makan ~15-20 menit paling lama) bisa nyangkut nyaris tanpa batas. 25 menit generous
    # utk kondisi normal (termasuk reseed 30 sekolah terberat), tapi tetap gagal cepat kalau hang.
    # Dinaikkan ke 35 — run 2bf3e01 kena timeout di 25m pas suite Playwright msh jalan normal
    # (bukan hang, build/lint/tsc semua lolos duluan), diduga efek rollout ConfirmSubmitButton
    # yang nambah banyak dialog-klik ekstra per test; 35m kasih ruang lolos beneran kalau bukan hang.
    timeout-minutes: 35
    # Migrasi PostgreSQL (Sep 2026) — CI sekarang lawan Postgres asli (container service bawaan
    # GitHub Actions), bukan lagi file SQLite lokal, biar bug spesifik-provider ketauan di sini
    # dulu sebelum nyentuh Supabase staging/prod. Container ini efemeral per run, gak numpuk ke
    # connection limit Supabase — gak perlu project Supabase terpisah buat CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: selaras_ajar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/selaras_ajar_ci"
      SESSION_SECRET: "ci-secret-bukan-untuk-produksi"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npx tsc --noEmit
      # visual-regression.spec.ts sengaja dikeluarkan dari gate ini — dia reseed DB penuh sendiri
      # di beforeAll SETIAP test-nya (~2.5 menit/test lokal, lebih di runner ini), dan baseline-nya
      # basi krn banyak UI berubah sesi ini (bukan bug fungsional). Investigasi run yg dulunya
      # timeout: bukan Playwright hang, tapi worker restart per test gagal x reseed berulang ini
      # yang makan >20 menit sendiri. Jalankan manual (`npx playwright test visual-regression
      # --update-snapshots`) & commit baseline barunya sbg kerjaan terpisah, baru masukkan lagi ke sini.
      - run: npx playwright test --grep-invert "Visual —"
      - name: Upload laporan Playwright kalau ada test gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    # Cuma jalan pas push langsung ke main (bukan di PR — PR cuma perlu lolos job "test" di atas
    # sbg required check, gak boleh sampai punya akses SSH produksi).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            cd ~/selaras-ajar-app
            bash deploy.sh
